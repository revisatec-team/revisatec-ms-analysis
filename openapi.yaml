openapi: 3.0.3
info:
  title: RevisaTEC - MS2 Rúbrica IA y reportes
  version: 1.0.0
  description: |
    Rúbrica, indicaciones, análisis, retroalimentación, inconvenientes y reportes.
    Python / FastAPI + Cosmos DB (API Mongo). Publica eventos en Azure Queue Storage.
    Todo el tráfico entra por APIM. Fechas en Epoch (milisegundos, UTC).
    Errores: { "error": "mensaje" } con códigos 400 (validación), 401 (sin clave en APIM) y 404.
servers:
  - url: https://apimanagementcristopherarayavega.azure-api.net/revisatec
    description: APIM (único punto de entrada)
security:
  - apimSubscriptionKey: []
tags:
  - name: Health
  - name: Course configuration
  - name: Group analysis
  - name: Feedback
  - name: Reports
paths:
  /health:
    get:
      tags: [Health]
      summary: Estado del servicio
      operationId: ms2Health
      responses:
        '200':
          description: Servicio activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /courses/{id}/rubric:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Course configuration]
      summary: Obtener rúbrica del curso
      operationId: getRubric
      responses:
        '200':
          description: Rúbrica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Course configuration]
      summary: Crear o reemplazar la rúbrica del curso
      description: Los pesos deben sumar 100 y cada peso estar entre 0 y 100. Si se omiten fileName e interpretationStatus se conservan los existentes.
      operationId: updateRubric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rubric'
      responses:
        '200':
          description: Rúbrica guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
        '400':
          $ref: '#/components/responses/BadRequest'
  /courses/{id}/instructions:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Course configuration]
      summary: Obtener indicaciones para la IA
      operationId: getInstructions
      responses:
        '200':
          description: Indicaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructions'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Course configuration]
      summary: Crear o actualizar indicaciones para la IA
      operationId: updateInstructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instructions'
      responses:
        '200':
          description: Indicaciones guardadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructions'
        '400':
          $ref: '#/components/responses/BadRequest'
  /courses/{id}/scraping-config:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Course configuration]
      summary: Obtener la configuración de análisis del repositorio
      operationId: getScrapingConfig
      responses:
        '200':
          description: Configuración
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapingConfig'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Course configuration]
      summary: Crear o actualizar la configuración de análisis
      description: Recalcula nextRunAt según la frecuencia.
      operationId: updateScrapingConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScrapingConfig'
      responses:
        '200':
          description: Configuración guardada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapingConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
  /groups/{id}/analysis:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Group analysis]
      summary: Puntaje, criterios y evidencia del grupo
      description: Se calcula al consultar, con las reglas de docs/reglas-rubrica.md. Responde 404 si el curso no tiene rúbrica.
      operationId: getGroupAnalysis
      responses:
        '200':
          description: Análisis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '404':
          $ref: '#/components/responses/NotFound'
  /groups/{id}/progress-summary:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Group analysis]
      summary: Estado del avance por criterio
      operationId: getProgressSummary
      responses:
        '200':
          description: Síntesis de avance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /groups/{id}/criteria:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Group analysis]
      summary: Nivel de cumplimiento por criterio
      operationId: getGroupCriteria
      responses:
        '200':
          description: Cumplimiento por criterio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupCriteria'
        '404':
          $ref: '#/components/responses/NotFound'
  /groups/{id}/feedback:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Feedback]
      summary: Obtener la retroalimentación (versión IA y versión del profesor)
      description: Si el grupo no tiene retroalimentación, crea un borrador con el texto de la IA.
      operationId: getFeedback
      responses:
        '200':
          description: Retroalimentación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Feedback]
      summary: Guardar la versión editada por el profesor
      description: Requiere que ya exista la retroalimentación (404 si no).
      operationId: updateFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackInput'
      responses:
        '200':
          description: Retroalimentación actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /groups/{id}/feedback/publish:
    parameters:
      - $ref: '#/components/parameters/id'
    post:
      tags: [Feedback]
      summary: Publicar la retroalimentación al estudiante
      description: |
        Exige texto del profesor (400 si falta). Marca status = published y emite FEEDBACK_PUBLISHED
        a la cola. Si la cola falla, la publicación se conserva y notified = false.
      operationId: publishFeedback
      responses:
        '200':
          description: Retroalimentación publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /groups/{id}/direct-reviews:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Feedback]
      summary: Listar revisiones directas del grupo (paginado, más recientes primero)
      operationId: listDirectReviews
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DirectReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Feedback]
      summary: Crear una revisión directa fuera del flujo normal
      operationId: createDirectReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectReviewInput'
      responses:
        '201':
          description: Revisión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /groups/{id}/issues:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Group analysis]
      summary: Inconvenientes detectados (paginado, más recientes primero)
      description: Detecta commits de prueba de forma idempotente y emite ISSUE_DETECTED a la cola por cada inconveniente nuevo.
      operationId: listGroupIssues
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /groups/{id}/report:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Reports]
      summary: Reporte del grupo (checklist de hitos)
      operationId: getGroupReport
      responses:
        '200':
          description: Reporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    apimSubscriptionKey:
      type: apiKey
      in: header
      name: Ocp-Apim-Subscription-Key
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Identificador del curso o del grupo.
      schema:
        type: integer
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  responses:
    BadRequest:
      description: Solicitud o validación inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Los pesos de la rúbrica deben sumar 100
    NotFound:
      description: Recurso no encontrado (por ejemplo, el curso no tiene rúbrica configurada).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: El curso 1 no tiene una rúbrica configurada
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      required: [status, service, timestamp]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: revisatec-ms-analysis
        timestamp:
          type: integer
          format: int64
          description: Epoch ms
          example: 1793000000000
    PageMeta:
      type: object
      required: [totalRecords, page, pageSize, items]
      properties:
        totalRecords:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
    Rubric:
      type: object
      required: [criteria]
      properties:
        criteria:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, weight]
            properties:
              name:
                type: string
                minLength: 1
                example: Calidad de código
              weight:
                type: number
                minimum: 0
                maximum: 100
                example: 40
        fileName:
          type: string
          nullable: true
          description: Archivo de rúbrica interpretado.
        interpretationStatus:
          type: string
          nullable: true
          description: Estado de la interpretación.
    Instructions:
      type: object
      required: [text]
      properties:
        text:
          type: string
          maxLength: 1000
          description: Indicaciones para la IA
    ScrapingConfig:
      type: object
      required: [frequency, minReviewers]
      properties:
        frequency:
          type: string
          enum: [hourly, daily, weekly]
        minReviewers:
          type: integer
          minimum: 1
          example: 2
        nextRunAt:
          type: integer
          format: int64
          nullable: true
          description: Próximo análisis (lo calcula el servicio). Epoch ms
    CriterionScore:
      type: object
      required: [name, score, max, percent, level, type]
      properties:
        name:
          type: string
        score:
          type: number
        max:
          type: number
        percent:
          type: integer
        level:
          type: string
          enum: [Bueno, En progreso, Bajo]
        type:
          type: string
          enum: [success, warning, alert]
    Evidence:
      type: object
      required: [id, type, text, author, when]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [pr, commit]
        text:
          type: string
        author:
          type: string
        reviewer:
          type: string
          nullable: true
        when:
          type: integer
          format: int64
          description: Epoch ms
    Analysis:
      type: object
      required: [score, progress, criteria, evidence]
      properties:
        score:
          type: number
          example: 59
        progress:
          type: integer
          example: 66
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/CriterionScore'
        evidence:
          type: array
          description: Los 10 eventos más recientes.
          items:
            $ref: '#/components/schemas/Evidence'
    ProgressSummary:
      type: object
      required: [groupId, overall, items, generatedAt]
      properties:
        groupId:
          type: integer
        overall:
          type: integer
          minimum: 0
          maximum: 100
        items:
          type: array
          items:
            type: object
            required: [criterionId, status, note]
            properties:
              criterionId:
                type: string
              status:
                type: string
                enum: [on_track, at_risk, delayed]
              note:
                type: string
        generatedAt:
          type: integer
          format: int64
          description: Epoch ms
    CriterionCompliance:
      type: object
      required: [criterionId, name, level, score]
      properties:
        criterionId:
          type: string
        name:
          type: string
        level:
          type: string
          enum: [not_met, partial, met]
        score:
          type: number
    GroupCriteria:
      type: object
      required: [groupId, items]
      properties:
        groupId:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CriterionCompliance'
    Feedback:
      type: object
      properties:
        groupName:
          type: string
          nullable: true
        deliveryTitle:
          type: string
          nullable: true
          example: 'Entrega 2: Prototipo'
        score:
          type: number
          nullable: true
        ai:
          type: string
          nullable: true
          description: Propuesta de la IA
        professor:
          type: string
          nullable: true
          description: Versión editable del profesor
        status:
          type: string
          enum: [draft, published]
        publishedAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch ms
        notified:
          type: boolean
          nullable: true
          description: Solo en la respuesta de publish. false si la cola falló.
    FeedbackInput:
      type: object
      required: [professor]
      properties:
        ai:
          type: string
        professor:
          type: string
    DirectReviewInput:
      type: object
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          description: No puede estar vacía ni ser solo espacios.
    DirectReview:
      allOf:
        - $ref: '#/components/schemas/DirectReviewInput'
        - type: object
          required: [id, date]
          properties:
            id:
              type: string
            date:
              type: integer
              format: int64
              description: Epoch ms
    Issue:
      type: object
      required: [id, groupId, groupName, type, description, date, status]
      properties:
        id:
          type: string
        groupId:
          type: integer
        groupName:
          type: string
        type:
          type: string
          example: Commits de prueba
        description:
          type: string
        date:
          type: integer
          format: int64
          description: Fecha del commit detectado. Epoch ms
        status:
          type: string
          enum: [Sin resolver, Resuelto]
    Report:
      type: object
      required: [checklist]
      properties:
        checklist:
          type: array
          items:
            type: object
            required: [name, date, status]
            properties:
              name:
                type: string
              date:
                type: integer
                format: int64
                description: Epoch ms
              status:
                type: string
                enum: [completado, pendiente]